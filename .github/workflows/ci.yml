name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Structure & offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Script syntax
        run: node tests/syntax-check.js
      - name: Skill package structure
        run: node tests/skill-manifest.js
      - name: Template smoke test (no browser, no network)
        run: node tests/smoke-template.js
      - name: Install script behaviour
        run: node tests/install-script.js

  render:
    name: Real browser render (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [tcp-handshake, token-explained, context-cost]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium
      - name: Render every frame of the example, one preview per segment plus a storyboard
        run: node making-canvas-explainer-videos/scripts/check.js examples/${{ matrix.example }}/page.html --sheet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-${{ matrix.example }}
          path: examples/${{ matrix.example }}/preview
          if-no-files-found: warn
